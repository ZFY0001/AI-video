<text x="44" y="492" fill="#536279" font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400">生成方式：离线示意 / 代码绘制 / 已接入生成器</text>
<rect x="24" y="526" width="720" height="56" rx="12" fill="#ffffff" stroke="#dce2ec"/>
<text x="44" y="558" fill="#202b3c" font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400">高级设置  &gt;   色板、画质、帧率、构图参考</text>
