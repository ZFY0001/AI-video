<text x="44" y="630" fill="#202b3c" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="700">条件设置就近出现</text>
<text x="44" y="659" fill="#202b3c" font-family="Microsoft YaHei,sans-serif" font-size="14" font-weight="400">选择 MV / 配乐后，在基本设置旁展开音轨和歌词。</text>
<text x="44" y="682" fill="#667085" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400">选择代码绘制后，才展示有效的画质与帧率。</text>
<rect x="760" y="128" width="496" height="286" rx="12" fill="#ffffff" stroke="#dce2ec"/>
<text x="780" y="162" fill="#202b3c" font-family="Microsoft YaHei,sans-serif" font-size="16" font-weight="700">预览与结果</text>
<rect x="780" y="184" width="456" height="174" rx="8" fill="#edf0f6" stroke="#dce2ec"/>
<text x="905" y="262" fill="#7c8798" font-family="Microsoft YaHei,sans-serif" font-size="17" font-weight="400">生成后在此预览</text>
<text x="780" y="391" fill="#667085" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400">未开始时：示例 / 最近作品 / 下一步提示</text>
