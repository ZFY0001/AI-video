<text x="780" y="537" fill="#536279" font-family="Microsoft YaHei,sans-serif" font-size="15" font-weight="400">准备 → 拆解 → 生成 → 合成</text>
<text x="780" y="580" fill="#667085" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400">连接状态与任务状态分开，不用空日志撑高页面。</text>
<rect x="760" y="624" width="496" height="56" rx="12" fill="#ffffff" stroke="#dce2ec"/>
<text x="780" y="655" fill="#202b3c" font-family="Microsoft YaHei,sans-serif" font-size="13" font-weight="400">运行日志  &gt;   默认收起，出现异常时自动提示</text>
